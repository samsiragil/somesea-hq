    "title": "Decision log",
    "path": "00-Governance/DECISION-LOG.md",
    "content": "# Decision log\n\nVersi 0.1.0 · Tanggal pencatatan awal: 20 Oktober 2026  \nTanggal pencatatan bukan klaim tanggal keputusan historis.\n\n| ID | Status | Keputusan/rancangan | Sumber/alasan | Dampak |\n|---|---|---|---|---|\n| D-001 | FINAL | Handle @somesea__ | S-02, koreksi pengguna | Gunakan dua underscore di semua profil |\n| D-002 | FINAL | Somesea berasal dari pelesetan Samsi | S-02 | Cerita personal brand |\n| D-003 | FINAL | Pendekatan personal yang dekat dan natural | S-03 | Nada komunikasi manusiawi |\n| D-004 | FINAL | Somesea HQ untuk bisnis personal Sams | S-01 | Satu pusat kerja |\n| D-005 | FINAL | Jasa digital AI-assisted dan stack-agnostic | S-01 | Pemilihan teknologi mengikuti kebutuhan |\n| D-006 | FINAL | Target omzet Rp5.000.000/bulan | S-01 | Target pengukuran; bukan hasil aktual |\n| D-007 | FINAL | Satukan seluruh komponen operasional yang diminta | S-01 | Struktur paket HQ |\n| P-001 | USULAN | Markdown lokal sebagai fondasi HQ | Mudah dipindahkan dan dibaca | Implementasi awal dibuat; pilihan permanen belum dikonfirmasi |\n| P-002 | USULAN | Uji penawaran solusi digital dengan lingkup kecil | Mempercepat pembuktian kebutuhan | Lihat strategi |\n| P-003 | USULAN | Mulai roadmap relatif Day 1–90 | Tanggal mulai belum diketahui | Tidak mengasumsikan mulai hari ini |\n| P-004 | USULAN | CRM manual dan review mingguan | Belum ada volume prospek terukur | Hindari pembangunan tool prematur |\n| P-005 | USULAN | Ukur omzet proyek diterima terpisah dari kas | Menghindari hitung DP dua kali | Definisi operasional, bukan kebijakan akuntansi final |\n\n## Format entri lanjutan\n\n- ID:\n- Tanggal keputusan:\n- Tanggal pencatatan:\n- Pemilik:\n- Status: USULAN / EKSPERIMEN / FINAL / DIGANTI\n- Keputusan dan batas penerapan:\n- Sumber persetujuan Sams:\n- Alasan dan alternatif:\n- Dokumen/aset terdampak:\n- Menggantikan ID:\n- Kapan ditinjau ulang:\n\nJangan menghapus keputusan lama. Tandai DIGANTI dan tautkan keputusan penggantinya. Bukt     "title": "Dokumen master · Somesea HQ",
    "path": "00-Governance/MASTER.md",
    "content": "# Dokumen master · Somesea HQ\n\nVersi 0.1.0 · 20 Oktober 2026 · Pemilik keputusan: Sams  \nStatus: **fondasi terkonfirmasi; detail operasional usulan; rekonsiliasi sumber belum lengkap**.\n\n## Arah bisnis yang terkonfirmasi\n\nSomesea HQ adalah pusat kerja permanen untuk bisnis personal Sams, dengan akun **@somesea__**. Nama Somesea merupakan pelesetan dari nama Samsi. Pendekatan yang dipilih adalah personal branding yang dekat dan natural bagi calon klien.\n\nBisnis menawarkan jasa digital dengan proses **AI-assisted** dan **stack-agnostic**, sesuai instruksi saat ini. Sasaran omzet adalah **Rp5.000.000 per bulan**. Target adalah tujuan, bukan pendapatan yang sudah tercapai.\n\n| ID | Keputusan final | Bukti |\n|---|---|---|\n| D-001 | Gunakan @somesea__ sebagai identitas akun; koreksi @somesea | S-02, pesan pengguna |\n| D-002 | Filosofi nama berasal dari pelesetan Samsi | S-02 |\n| D-003 | Utamakan personal branding yang dekat dan natural | S-03 |\n| D-004 | Bentuk pusat kerja Somesea HQ untuk bisnis personal Sams | S-01, permintaan sekarang |\n| D-005 | Arah jasa digital AI-assisted, stack-agnostic | S-01 |\n| D-006 | Target omzet Rp5 juta/bulan | S-01 |\n| D-007 | HQ mencakup roadmap, CRM, playbook, SOP, dashboard, versi, dan inventaris | S-01 |\n\n## Cara membaca status\n\n- **FINAL**: keputusan eksplisit Sams dengan sumber yang bisa ditelusuri.\n- **USULAN**: rancangan kerja yang dibuat dalam paket ini; belum disetujui.\n- **EKSPERIMEN**: usulan yang disetujui untuk diuji; tetap bukan klaim pasar terbukti.\n- **BELUM TERVERIFIKASI**: pernah disebut atau dibutuhkan, tetapi isi/berkas belum diperiksa.\n- **DIGANTI**: keputusan lama yang memiliki pengganti; tetap disimpan dalam log.\n\nPersetujuan umum “sudah setuju semua” memang ada pada S-04. Karena isi jawaban yang disetujui tidak terbaca, kalimat tersebut tidak dipakai untuk mengesahkan harga, paket, visual, atau SOP yang tidak diketahui.\n\n## Peta kerja\n\n| Bidang | Dokumen acuan | Status isi |\n|---|---|---|\n| Branding | [Brand](../01-Brand/BRAND.md) | Identitas final; copy dan visual usulan |\n| Jasa dan omzet | [Strategi](../02-Strategy/STRATEGY.md) | Arah dan target final; paket/harga usulan |\n| Eksekusi | [90 hari](../03-Roadmap/90-DAYS.md) | Usulan baru, tanggal mulai belum ditetapkan |\n| Penjualan | [Playbook](../04-Sales/PLAYBOOK.md), [CRM](../04-Sales/CRM.md) | Template baru siap diisi |\n| Produksi | [SOP](../05-Delivery/SOP.md) | Usulan prosedur |\n| Pengendalian | [Dashboard](../06-Business-OS/DASHBOARD.md) | Dashboard manual baru; bukan aset lama |\n| Tools | [Inventaris](../07-Tools/INVENTORY.md) | Status ketersediaan per aset |\n\n## Aturan pengelolaan yang diusulkan\n\n1. Dokumen di folder topik adalah sumber kerja aktif. Dashboard merangkum dan menautkan, bukan menggandakan semua data.\n2. Catat perubahan keputusan dalam [decision log](DECISION-LOG.md), dengan sumber persetujuan, tanggal, dan dampak.\n3. Versi `MAJOR.MINOR.PATCH`: MAJOR untuk perubahan arah bisnis; MINOR untuk keputusan/proses baru; PATCH untuk koreksi tanpa perubahan keputusan. Versi awal 0.1.0 menandakan rekonsiliasi belum selesai.\n4. Sebelum perubahan substantif, simpan snapshot bertanggal di `09-Archive/Releases`. Catat ringkasannya pada [changelog](CHANGELOG.md).\n5. Sebelum menyebut rilis 1.0.0, pulihkan sumber atau catat keputusan Sams untuk menggantinya, tinjau usulan, dan uji satu alur prospek → proyek → pembayaran.\n6. Cadangkan mingguan ke lokasi kedua yang dipilih Sams. Paket ZIP awal adalah salinan distribusi, bukan backup otomatis.\n\n## Keputusan yang masih terbuka\n\n| ID | Perlu ditentukan | Mengapa penting |\n|---|---|---|\n| Q-01 | Isi jawaban lama dan file Business OS asli | Menghindari penggantian kesepakatan lama oleh asumsi baru |\n| Q-02 | Tanggal mulai dan jam tersedia/minggu | Menyesuaikan roadmap dan kapasitas proyek |\n| Q-03 | Segmen awal serta masalah yang paling sering ditemui | Membatasi eksperimen penjualan |\n| Q-04 | Paket, harga minimum, DP, revisi, dan dukungan | Menjaga batas pekerjaan dan arus kas |\n| Q-05 | Definisi omzet untuk evaluasi, biaya, dan target laba | Target omzet tidak sama dengan kas atau laba |\n| Q-06 | Lokasi backup dan tools yang benar-benar sedang dipakai | Menjamin keberlanjutan HQ |\n| Q-07 | Logo, warna, tipografi, serta izin penggunaan portofolio | Belum ada aset visual terverifikasi |\n\nPrioritas berikutnya: rekonsiliasi sumber, tetapkan kapasitas, lalu uji satu penawaran kecil. Hindari membangun banyak tools sebelum ada proses yang terbukti perlu dipercepat.\n"
  },

    "path": "00-Governance/SOURCES.md",
    "content": "# Register sumber dan batas kelengkapan\n\nVersi 0.1.0 · Diperiksa 20 Oktober 2026\n\nSumber percakapan: [Strategi Coding Dan Konten](chatgpt-conversation://6ad6d77f-e47c-83ec-a6f4-590949cca6f8).\n\nPembacaan menggunakan ID percakapan tersebut, batas 10 giliran. Alat mengembalikan lima giliran, `hasMore=false`, tanpa cursor lanjutan. Jawaban asisten hanya berupa `chatgpt-content-reference`; tidak ada isi substantif yang dapat direkonstruksi secara andal.\n\n| ID | Bukti yang tersedia | Pemakaian |\n|---|---|---|\n| S-01 | Permintaan pengguna pada chat ini, 20 Oktober 2026 | Nama HQ, Sams, jasa AI-assisted/stack-agnostic, target omzet, cakupan HQ |\n| S-02 | Pesan a0309d77-3a30-47ed-b238-249cbe381de3 | Koreksi handle menjadi @somesea__; filosofi Samsi |\n| S-03 | Pesan 636cae90-7ba4-4ed6-8571-2a08ffed0274 | Preferensi personal branding, dekat dengan calon klien |\n| S-04 | Pesan d7803e73-605d-40a6-9a9c-1724c7c893bc | Persetujuan umum dan keinginan menyimpan konsep/tools; isi konsep tidak tersedia |\n| S-05 | Pesan 9f8e0922-c151-4718-9d85-346beb489fcf | Sebutan awal @somesea, telah dikoreksi oleh S-02 |\n| S-06 | Pesan 694f4615-50b4-4a5b-b2b7-1753cf783c29 | Permintaan nama brand; jawaban nama tidak terbaca |\n\nLampiran `image(1).png` terdaftar dalam respons alat, tetapi belum diperiksa dan tidak diimpor. Tidak ada kesimpulan visual yang diambil dari lampiran ini.\n\n## Materi yang belum tersedia\n\n- Jawaban branding: 9e1d20cf-30d8-4c60-b58d-78332ba1cd04 dan 2eb5eba6-1cbd-4281-892b-79243f2b5a5c.\n- Jawaban penyimpanan/HQ: f65ea81a-eff9-4600-ab0c-043ae9492f99 dan 078f0115-a92a-4846-ab4a-37e4b73afdd7.\n- Rincian strategi terdahulu, harga, segmen, roadmap, CRM, SOP, dan kode/file dashboard.\n- Daftar langganan, akun layanan, atau tools aktif milik Sams.\n\nSemua rincian baru dalam paket ini adalah rancangan penyusun, bukan kutipan atau pemulihan jawaban lama.\n\n## Checklist rekonsiliasi setelah sumber diterima\n\n1. Simpan ekspor percakapan, lampiran, dan file asli di `08-Assets/Incoming`; pertahankan nama asli.\n2. Tambahkan ID sumber dan lokasi file. Bedakan ucapan pengguna dari saran asisten.\n3. Cocokkan setiap kesepakatan dengan D-001 dan seterusnya. Isi yang berbeda masuk daftar konflik, jangan langsung ditimpa.\n4. Periksa aset lama: dapat dibuka, fungsi yang ada, penyimpanan data, dependensi, dan ekspor.\n5. Pindahkan salinan aset yang sudah diperiksa ke folder yang sesuai; jangan hapus file asal.\n6. Perbarui status inventaris, log keputusan, master, dan changelog. Simpan snapshot sebelum perubahan.\n7. Catat secara eksplisit bagian yang tetap tidak dapat dipulihkan.\n"

    "title": "Brand · Sams / Somesea",
    "path": "01-Brand/BRAND.md",
    "content": "# Brand · Sams / Somesea\n\nVersi 0.1.0\n\n## FINAL — identitas\n\n- Nama personal: Sams, sesuai permintaan saat ini.\n- Nama Somesea berasal dari pelesetan Samsi.\n- Handle: **@somesea__**.\n- Pendekatan: personal branding yang dekat, natural, dan mudah diajak membicarakan kebutuhan.\n\n## USULAN — penerapan komunikasi\n\nNama tampilan: **Sams · Somesea**.\n\nKalimat positioning:\n> Aku bantu mengubah pekerjaan yang ribet jadi solusi digital yang praktis—mulai dari website sampai alat kerja sederhana.\n\nBio:\n> Sams — bikin solusi digital sesuai kebutuhanmu. Berbagi proses, hasil, dan hal yang kupelajari. Ada pekerjaan yang ingin dibuat lebih praktis? Cerita dulu.\n\nGunakan “aku” pada akun personal dan bahasa sederhana sesuai lawan bicara. Jelaskan masalah, hasil yang diharapkan, batas pekerjaan, dan langkah berikutnya. AI adalah bantuan dalam proses; Sams tetap bertanggung jawab atas pemeriksaan dan hasil.\n\nJangan menjanjikan “semua aplikasi bisa”, hasil bisnis pasti, biaya termurah, atau pengerjaan kilat tanpa melihat lingkupnya. Kedekatan personal tidak berarti semua permintaan masuk harga awal.\n\n## USULAN — strategi konten awal\n\n| Pilar | Bentuk | Arah percakapan |\n|---|---|---|\n| Masalah sehari-hari | Cerita satu proses manual yang menyita waktu | “Bagian mana yang paling menyita waktumu?” |\n| Bukti kerja | Demo sebelum/sesudah dengan data contoh | Ajak membicarakan masalah serupa |\n| Proses personal | Catatan membangun dan pelajaran proyek | Bangun rasa kenal dan kepercayaan |\n\nEksperimen empat minggu: dua unggahan per minggu, satu tentang masalah dan satu demo/proses. Ukur percakapan relevan, discovery, dan prospek berkualitas; jumlah tayangan hanya metrik pendukung.\n\nSemua contoh proyek harus diberi label demo bila bukan proyek klien. Minta izin sebelum menampilkan nama, data, atau hasil klien.\n\n## BELUM TERVERIFIKASI — identitas visual\n\nLogo, warna, font, avatar, dan desain profil dari percakapan lama belum dipulihkan. Simpan aset terverifikasi di `08-Assets/Brand`. Jangan menganggap screenshot yang belum diperiksa sebagai sistem visual final.\n"
  },
  {
    "title": "Strategi jasa dan omzet",
    "path": "02-Strategy/STRATEGY.md",
    "content": "# Strategi jasa dan omzet\n\nVersi 0.1.0 · Arah AI-assisted/stack-agnostic dan target Rp5 juta/bulan: FINAL. Rincian di bawah: USULAN.\n\n## Fokus penawaran\n\nMulai dari satu masalah kecil dengan hasil yang dapat diperiksa. Kandidat segmen untuk diuji: usaha kecil dan profesional mandiri yang menerima order lewat chat atau mengelola pekerjaan berulang secara manual. Segmen ini belum divalidasi.\n\n| Kandidat jasa | Hasil utama | Batas awal |\n|---|---|---|\n| Website penawaran | Jasa/produk jelas dan calon klien punya jalur menghubungi | Satu alur konversi; materi disediakan/disepakati |\n| Alat kerja internal sederhana | Satu proses pencatatan atau pelaporan lebih rapi | Satu pengguna/peran utama; integrasi dibatasi |\n| Perbaikan workflow | Mengurangi satu langkah manual yang berulang | Audit singkat, implementasi terbatas, dokumentasi |\n\nPilih satu kandidat untuk eksperimen awal. Jangan menawarkan semuanya sebagai paket siap jual sebelum estimasi dan kemampuan delivery diperiksa.\n\n## AI-assisted, stack-agnostic dalam praktik\n\nMulai dari kebutuhan, lalu nilai teknologi berdasarkan: kecocokan fungsi, kemampuan Sams memelihara, biaya berjalan, hosting, integrasi, ekspor data, dan kemudahan serah terima. Stack-agnostic berarti fleksibel memilih, bukan klaim menguasai semua stack.\n\nAI dapat membantu merumuskan kebutuhan, membuat draft, coding, dan pemeriksaan. Verifikasi hasil secara manual dan melalui pengujian yang relevan. Hindari memasukkan rahasia atau data pribadi klien ke layanan AI tanpa dasar izin yang sesuai.\n\n## Model target — ilustrasi, bukan harga final\n\n| Skenario | Perhitungan | Omzet bulanan |\n|---|---|---:|\n| Dua proyek | 2 × Rp2.500.000 | Rp5.000.000 |\n| Satu proyek dan dua pekerjaan kecil | Rp3.000.000 + 2 × Rp1.000.000 | Rp5.000.000 |\n\nAngka ini hanya model perencanaan. Harga perlu diuji terhadap lingkup, waktu, kemampuan bayar, dan biaya. Belum ada tarif pasar atau proyeksi penjualan yang terverifikasi.\n\nHarga minimum internal usulan = perkiraan jam × nilai jam internal + biaya langsung + cadangan risiko. Nilai jam dan cadangan harus ditetapkan Sams setelah mengukur kapasitas. Pisahkan biaya pembuatan, hosting/langganan, perubahan lingkup, dan dukungan.\n\n## Definisi metrik usulan\n\n- **Nilai deal**: nilai kontrak disetujui; belum tentu omzet selesai atau kas masuk.\n- **Omzet operasional**: nilai pekerjaan/milestone yang telah diterima klien pada bulan tersebut, dihitung sekali.\n- **Kas masuk**: uang yang benar-benar diterima menurut tanggal pembayaran; DP termasuk di sini.\n- **Piutang tagihan**: total tagihan diterbitkan dikurangi pembayaran yang dialokasikan ke tagihan.\n- **Biaya langsung**: biaya khusus proyek. Sisa setelah biaya langsung bukan laba bersih.\n\nContoh: proyek Rp2,5 juta menerima DP Rp1 juta bulan pertama dan selesai bulan kedua. Dengan definisi di atas, kas bulan pertama Rp1 juta; omzet penyelesaian Rp2,5 juta pada bulan kedua. Jangan menjumlahkan DP lagi sebagai omzet tambahan.\n\n## Hipotesis funnel awal\n\nUntuk dua deal/bulan, ilustrasi rasio proposal → deal 25% membutuhkan 8 proposal. Jika discovery → proposal 50%, diperlukan 16 discovery; jika percakapan relevan → discovery 50%, diperlukan 32 percakapan relevan. Semua rasio ini asumsi, bukan benchmark atau bukti hasil.\n\nCatat rasio aktual selama empat minggu. Jika volume tersebut tidak realistis untuk kapasitas Sams, ubah lingkup/harga, segmen, atau kanal berdasarkan bukti, bukan sekadar menambah aktivitas.\n\n## Kriteria melanjutkan eksperimen\n\nSesudah minimal lima discovery, tinjau pola masalah, urgensi, anggaran, dan akses pengambil keputusan. Lanjutkan bila ada masalah berulang dan kesediaan membahas solusi berbayar. Jika belum ada, revisi pesan atau segmen. Ini kriteria belajar usulan, bukan jaminan statistik.\n"
  },

    "title": "Roadmap 90 hari",
    "path": "03-Roadmap/90-DAYS.md",
    "content": "# Roadmap 90 hari\n\nVersi 0.1.0 · **USULAN BARU**, bukan pemulihan roadmap lama.\n\nTanggal Day 1: belum ditetapkan · Kapasitas jam/minggu: belum diisi  \nHari terakhir = tanggal mulai + 89 hari. Target Rp5 juta/bulan dinilai per bulan kalender; review 30 hari dipakai untuk belajar.\n\n| Waktu | Fokus | Output dan kriteria selesai |\n|---|---|---|\n| Hari 1–7 | Fondasi | Tinjau keputusan; pilih kapasitas dan satu penawaran; isi profil; buat daftar 10 calon prospek relevan sebagai sasaran aktivitas usulan |\n| Hari 8–14 | Bukti awal | Satu demo dengan data contoh, satu brief penawaran, CRM berisi tindakan berikutnya; lakukan discovery awal |\n| Hari 15–21 | Pelajari kebutuhan | Upayakan total lima discovery; catat masalah, keberatan, anggaran, dan alasan belum membeli |\n| Hari 22–30 | Uji penawaran | Kirim proposal hanya pada prospek cocok; evaluasi pesan dan lingkup; catat hasil tanpa menganggap deal pasti |\n| Hari 31–45 | Delivery terkontrol | Jika ada deal, jalankan SOP dan catat waktu; bila belum, perbaiki penawaran berdasarkan discovery |\n| Hari 46–60 | Bukti dan perbaikan | Selesaikan milestone; minta umpan balik/izin studi kasus; evaluasi biaya dan revisi |\n| Hari 61–75 | Ulangi proses terbaik | Fokus pada kanal dan jenis pekerjaan yang menghasilkan prospek cocok; uji dukungan lanjutan hanya jika dibutuhkan |\n| Hari 76–90 | Stabilkan operasi | Evaluasi omzet bulanan vs Rp5 juta; tentukan penawaran lanjutan; pilih maksimal satu tool untuk dikembangkan berdasarkan hambatan aktual |\n\n## Ritme mingguan usulan\n\n- Senin: tinjau pipeline dan kapasitas; pilih tiga hasil prioritas minggu ini.\n- Selasa–Kamis: discovery, follow-up yang relevan, dan blok delivery; jaga waktu khusus penjualan meski proyek aktif.\n- Jumat: demo/serah terima, cek pembayaran, catat metrik dan keputusan.\n- Konten: dua unggahan per minggu sebagai eksperimen awal; sesuaikan setelah kapasitas diketahui.\n\n## Gerbang evaluasi\n\n**Hari 30:** Apakah masalah yang sama berulang? Apakah ada proposal yang diminta? Bila belum, perbaiki segmen/pesan sebelum menambah tools.\n\n**Hari 60:** Apakah hasil diterima klien dengan waktu dan biaya yang masuk akal? Jika revisi melebar, perbaiki brief dan acceptance criteria.\n\n**Hari 90:** Bandingkan omzet selesai, kas, biaya, waktu, dan beban dukungan. Target dianggap tercapai hanya bila data mendukung Rp5 juta pada periode yang jelas; satu bulan tercapai belum membuktikan kestabilan.\n\n## Lembar evaluasi\n\nPeriode: belum diisi  \nHasil yang selesai: belum diisi  \nProspek/discovery/proposal/deal: belum diisi  \nOmzet/kas/biaya: belum diisi  \nPelajaran dan bukti: belum diisi  \nKeputusan minggu berikutnya + ID log: belum diisi\n"
  },

    "title": "CRM · sumber data prospek",
    "path": "04-Sales/CRM.md",
    "content": "# CRM · sumber data prospek\n\nVersi 0.1.0 · Template baru, **USULAN proses**. Belum berisi prospek aktual.\n\n## Pipeline\n\n| Tahap | Syarat masuk | Syarat keluar |\n|---|---|---|\n| Baru | Kontak relevan dan sumber tercatat | Pesan personal dikirim |\n| Dihubungi | Tanggal kontak dicatat | Balasan relevan atau jadwal follow-up |\n| Discovery | Bersedia membahas kebutuhan | Masalah, hasil, anggaran, waktu, dan pengambil keputusan cukup jelas |\n| Qualified | Masalah cocok dengan kapasitas; ada jalur keputusan | Lingkup dan estimasi siap ditawarkan |\n| Proposal | Proposal versi tertentu terkirim | Diterima, ditolak, atau diminta perubahan |\n| Won | Persetujuan tertulis atas lingkup dan harga | Buat ID proyek; kickoff mengikuti syarat pembayaran yang disepakati |\n| Lost | Ditolak/tidak cocok/tidak lanjut | Alasan dicatat |\n| Nurture | Belum waktunya, ada alasan untuk menjaga hubungan | Tanggal kontak ulang disepakati |\n\nWon tidak berarti pembayaran sudah diterima. Pembayaran dicatat terpisah.\n\n## Daftar prospek aktif\n\n| ID | Nama/usaha | Kanal/sumber | Masalah | Tahap | Nilai estimasi Rp | Kontak terakhir | Tindakan berikutnya | Jatuh tempo | Pemilik |\n|---|---|---|---|---|---:|---|---|---|---|\n\nTabel sengaja kosong. Gunakan ID L-001, L-002, dan seterusnya. Tanggal: YYYY-MM-DD. Nilai tidak diketahui ditulis “belum diketahui”, jangan dianggap nol.\n\n## Kartu prospek — duplikasi per lead\n\n- ID / nama:\n- Kontak dan kanal:\n- Sumber hubungan:\n- Masalah dan dampak:\n- Cara kerja sekarang:\n- Hasil yang diinginkan:\n- Anggaran / belum diketahui:\n- Tenggat dan alasan:\n- Pengambil keputusan:\n- Kecocokan dengan kapasitas:\n- Tahap / alasan:\n- Riwayat interaksi (tanggal, ringkasan, hasil):\n- Proposal (lokasi dan versi):\n- Tindakan berikutnya / tanggal:\n- Jika Won: ID proyek dan nilai disetujui:\n- Jika Lost: alasan:\n\n## Rutinitas\n\nSesudah setiap interaksi, perbarui tahap, ringkasan, dan tindakan berikutnya. Setiap hari cek tindakan jatuh tempo. Setiap minggu tinjau prospek tanpa gerak dan alasan kalah.\n\nSimpan hanya informasi yang dibutuhkan untuk hubungan bisnis. Jangan menyimpan kata sandi, identitas sensitif, atau data pelanggan milik prospek di CRM. CRM ini lokal dan tidak memiliki kontrol akses multi-pengguna.\n"
  },

    "title": "Sales playbook",
    "path": "04-Sales/PLAYBOOK.md",
    "content": "# Sales playbook\n\nVersi 0.1.0 · **USULAN**, seluruh teks adalah draft baru. Tidak ada pesan yang dikirim.\n\n## 1. Memulai percakapan\n\nPrioritaskan hubungan yang relevan, balasan pada pembahasan masalah, atau referensi. Personalisasikan berdasarkan hal yang benar-benar diketahui.\n\nDraft:\n> Halo [nama], aku Sams. Aku lihat [pengamatan spesifik]. Saat ini [proses] biasanya dikerjakan seperti apa? Aku sedang membantu merapikan proses seperti ini lewat solusi digital sederhana. Kalau relevan, aku ingin dengar kendalanya dulu.\n\nJangan menggunakan klaim “aku lihat” bila belum mengamati bisnis tersebut. Hindari pesan massal yang sama.\n\n## 2. Discovery\n\nAlokasi awal usulan: 20–30 menit.\n\n1. Apa pekerjaan yang paling merepotkan, dan siapa yang mengerjakannya?\n2. Seberapa sering terjadi? Apa akibat jika dibiarkan?\n3. Bagaimana prosesnya sekarang? Minta contoh dengan data aman.\n4. Hasil apa yang akan membuat solusi ini dianggap berhasil?\n5. Apa yang harus tersedia pada versi pertama, dan apa yang bisa menyusul?\n6. Siapa yang menyetujui, kapan dibutuhkan, dan kisaran anggaran yang tersedia?\n7. Siapa yang akan memakai serta merawatnya setelah selesai?\n\nTutup dengan ringkasan kebutuhan dan langkah berikutnya. Jika masalah atau kapasitas tidak cocok, jelaskan batas kemampuan secara jujur.\n\n## 3. Proposal\n\nGunakan [template brief/proposal](../05-Delivery/PROJECT-TEMPLATE.md).\n\nWajib memuat hasil, deliverable, pengecualian, kriteria diterima, jadwal beserta ketergantungan pada klien, harga, biaya pihak ketiga, pembayaran, revisi, perubahan lingkup, dukungan, dan masa berlaku penawaran.\n\nDP dan termin belum ditetapkan. Isilah berdasarkan kesepakatan sebelum proyek dimulai. Jangan menyatakan angka ilustrasi di strategi sebagai tarif resmi.\n\nDraft pengantar:\n> Dari obrolan kita, kebutuhan utamanya [masalah]. Aku mengusulkan [hasil/deliverable] dengan batas [lingkup]. Detail biaya, jadwal, dan yang perlu disiapkan ada di proposal. Kalau ada bagian yang belum cocok, kita bisa rapikan lingkupnya.\n\n## 4. Menangani keberatan\n\n| Keberatan | Respons yang bisa disesuaikan |\n|---|---|\n| Terlalu mahal | “Bagian mana yang paling penting sekarang? Kita bisa bahas versi lebih kecil dengan hasil yang tetap jelas.” |\n| Bisa pakai AI sendiri | “Bisa. Bagian jasaku mencakup merumuskan kebutuhan, menyambungkan alur, memeriksa hasil, dan menyiapkan serah terima.” |\n| Belum butuh | “Oke. Kapan biasanya kebutuhan ini mulai terasa? Kalau cocok, aku boleh menghubungi lagi saat itu.” |\n| Minta fitur tambahan | “Bisa kita nilai. Aku akan jelaskan dampaknya ke biaya dan jadwal sebelum dikerjakan.” |\n\n## 5. Follow-up\n\nUsulan ritme bila belum ada kesepakatan waktu: satu follow-up setelah tiga hari kerja, satu lagi sekitar tujuh hari kerja setelahnya. Hentikan jika diminta; pindahkan ke Nurture/Lost bila tidak ada alasan relevan untuk melanjutkan.\n\nDraft:\n> Halo [nama], aku menindaklanjuti proposal [topik]. Ada bagian yang perlu aku jelaskan atau sesuaikan? Kalau waktunya belum pas, boleh kabari agar aku bisa menyesuaikan.\n\n## 6. Closing dan handoff\n\nSimpan persetujuan tertulis atas proposal versi tertentu. Tandai Won, buat proyek, sepakati pembayaran dan kickoff, lalu jalankan SOP. Jangan memulai tambahan di luar lingkup hanya karena dibicarakan secara informal.\n\n## Metrik mingguan\n\nHitung percakapan relevan, discovery selesai, proposal terkirim, Won, dan Lost. Catat alasan kalah. Rasio harus membandingkan kelompok prospek/periode yang sama; jangan membagi Won lama dengan proposal baru dan menganggapnya conversion rate yang akurat.\n"

    "path": "05-Delivery/PROJECT-TEMPLATE.md",
    "content": "# Template brief, proposal, dan serah terima\n\nVersi template 0.1.0 · Duplikasi ke `05-Delivery/Projects/P-XXX-nama/BRIEF.md`.\n\nStatus dokumen: DRAFT — belum boleh dianggap penawaran disetujui.\n\n## Identitas\n\n- ID proyek / ID lead:\n- Nama klien dan kontak:\n- Pemilik keputusan klien:\n- Versi proposal / tanggal:\n- Status / tautan persetujuan:\n\n## Masalah dan hasil\n\n- Proses sekarang:\n- Masalah dan dampaknya:\n- Hasil yang ingin dicapai:\n- Ukuran keberhasilan:\n\n## Lingkup\n\n| Deliverable | Kriteria diterima | Materi dari klien | Tenggat |\n|---|---|---|---|\n\n- Tidak termasuk:\n- Asumsi dan ketergantungan:\n- Pilihan teknologi dan alasan:\n- Akun/hosting milik siapa:\n- Data yang dipakai dan izin:\n\n## Komersial\n\n- Harga jasa:\n- Biaya pihak ketiga / pihak yang membayar:\n- DP dan termin:\n- Batas revisi:\n- Biaya serta proses tambahan lingkup:\n- Jadwal dimulai setelah:\n- Dampak keterlambatan materi/persetujuan:\n- Ketentuan penghentian proyek:\n- Kepemilikan hasil dan penggunaan aset pihak ketiga:\n- Masa dukungan / cakupan / waktu respons:\n- Masa berlaku penawaran:\n\nSemua kolom relevan harus diisi sebelum dikirim. Tidak ada ketentuan komersial bawaan yang dianggap telah disetujui.\n\n## Catatan implementasi dan penerimaan\n\n- Milestone / demo:\n- Hasil pengujian:\n- Temuan UAT:\n- Persetujuan hasil / tanggal:\n- Perubahan lingkup yang disetujui:\n\n## Checklist serah terima\n\n- [ ] File/kode dan akses diberikan melalui saluran yang disepakati.\n- [ ] Panduan penggunaan dan pemeliharaan tersedia.\n- [ ] Akun, biaya berjalan, dan tanggal perpanjangan diketahui klien.\n- [ ] Backup/pemulihan dijelaskan bila relevan.\n- [ ] Tagihan dan pembayaran dicocokkan.\n- [ ] Batas dukungan dikonfirmasi.\n- [ ] Izin studi kasus diminta terpisah.\n- [ ] Evaluasi waktu, biaya, dan pelajaran selesai.\n"

    "title": "SOP delivery",
    "path": "05-Delivery/SOP.md",
    "content": "# SOP delivery\n\nVersi 0.1.0 · **USULAN prosedur**, belum dikonfirmasi sebagai SOP historis.\n\nPemilik seluruh langkah saat ini: Sams. Bila melibatkan orang lain, tentukan tanggung jawab dan akses secara tertulis.\n\n| Langkah | Tindakan | Bukti selesai |\n|---|---|---|\n| Intake | Tautkan lead, catat kebutuhan dan risiko, pastikan kapasitas | Brief terisi |\n| Scope | Tetapkan deliverable, batas, acceptance criteria, biaya, jadwal, dan revisi | Proposal versi disetujui |\n| Kickoff | Konfirmasi syarat pembayaran, materi, akses minimum, dan kanal komunikasi | Checklist kickoff lengkap |\n| Pilih solusi | Bandingkan opsi stack menurut kebutuhan dan pemeliharaan | Catatan keputusan teknologi |\n| Bangun | Kerjakan milestone kecil; catat perubahan dan bantuan AI yang relevan | Demo yang dapat diperiksa |\n| QA | Periksa alur utama, kondisi gagal, perangkat yang disepakati, akses, dan data | Checklist uji beserta hasil |\n| UAT | Klien menguji sesuai kriteria; klasifikasikan bug vs tambahan lingkup | Catatan penerimaan/perbaikan |\n| Serah terima | Berikan file/akses, panduan, biaya berjalan, backup, dan batas dukungan | Daftar serah terima diterima |\n| Tutup | Cocokkan tagihan/pembayaran; catat waktu dan biaya; minta umpan balik | Proyek ditutup dan arsip lengkap |\n\n## Pemeriksaan minimum sebelum rilis\n\n- Alur utama berhasil dari awal hingga hasil akhir.\n- Input kosong/salah dan kegagalan layanan ditangani dengan pesan yang jelas.\n- Jika ada login, akses data sesuai peran dan pengguna tidak dapat melihat data pihak lain.\n- Tidak ada kredensial di file yang dibagikan atau kode publik.\n- Data contoh dipisahkan dari data nyata.\n- Tampilan berfungsi pada perangkat/browser yang masuk lingkup.\n- Jika menyimpan data, ekspor/backup dan pemulihan diperiksa.\n- Dependensi, hosting, domain, akun pemilik, serta biaya berjalan terdokumentasi.\n- Klien menyetujui rilis dan tahu langkah bila terjadi gangguan.\n\nPilih pengujian sesuai risiko proyek. Checklist ini tidak menggantikan pemeriksaan khusus untuk sistem pembayaran, data sensitif, atau kebutuhan regulasi.\n\n## Perubahan lingkup\n\nCatat permintaan → jelaskan dampak biaya/jadwal → perbarui proposal/change request → minta persetujuan tertulis → kerjakan. Bug berarti perilaku menyimpang dari kriteria yang disetujui; fitur baru bukan otomatis bug.\n\n## Gangguan setelah rilis\n\nCatat waktu, dampak, pengguna terdampak, dan perubahan terakhir. Batasi dampak melalui rollback atau penghentian fitur jika perlu dan diizinkan. Beri pembaruan faktual, perbaiki, verifikasi, lalu dokumentasikan penyebab dan pencegahannya. Jangan menjanjikan respons 24/7 tanpa kesepakatan dukungan.\n\n## Backup HQ\n\nUsulan: setiap akhir minggu dan sebelum perubahan besar, salin seluruh folder HQ ke lokasi kedua yang dipilih Sams. Sesekali buka salinan untuk memeriksa pemulihan. Jangan memasukkan kata sandi/API key ke arsip. Belum ada backup otomatis yang diaktifkan.\n"
  },
  {
    "title": "Somesea · Business OS",
    "path": "06-Business-OS/DASHBOARD.md",
    "content": "# Somesea · Business OS\n\n**Sams / @somesea__** · Versi 0.1.0 · Dashboard manual baru  \nStatus data: **belum diisi**. Tidak ada data dummy yang dihitung sebagai bisnis aktual.\n\n## Fokus hari ini\n\nTanggal: belum diisi\n\n- [ ] Prioritas 1: isi kapasitas mingguan dan tanggal mulai roadmap.\n- [ ] Prioritas 2: pilih satu penawaran untuk diuji.\n- [ ] Prioritas 3: masukkan prospek pertama beserta tindakan berikutnya.\n\n## Ringkasan bulan\n\nBulan: belum dipilih · Terakhir diperbarui: belum diisi\n\n| Metrik | Aktual | Target / definisi |\n|---|---|---|\n| Omzet operasional | Belum dicatat | Rp5.000.000/bulan |\n| Selisih terhadap target | Belum dapat dihitung | Maksimum antara 0 dan target − omzet |\n| Kas masuk | Belum dicatat | Pembayaran yang benar-benar diterima |\n| Piutang tagihan | Belum dicatat | Tagihan diterbitkan − pembayaran dialokasikan |\n| Biaya langsung | Belum dicatat | Khusus proyek, bukan seluruh biaya usaha |\n| Proposal terbuka | Belum dicatat | Jumlah lead tahap Proposal |\n| Proyek aktif | Belum dicatat | Proyek belum ditutup |\n| Follow-up jatuh tempo | Belum dicatat | Tindakan aktif dengan tanggal ≤ hari ini |\n\nAngka diisi manual dari sumber di bawah. “Belum dicatat” tidak sama dengan nol. Definisi omzet masih usulan dan harus konsisten setelah dipilih.\n\n## Meja kerja\n\n| Area | Buka | Tindakan rutin |\n|---|---|---|\n| Penjualan | [CRM](../04-Sales/CRM.md) | Cek jatuh tempo dan isi tindakan berikutnya |\n| Penawaran | [Playbook](../04-Sales/PLAYBOOK.md) | Siapkan discovery/proposal |\n| Produksi | [SOP](../05-Delivery/SOP.md) | Tuntaskan milestone terdekat |\n| Keuangan | [Ledger](FINANCE.md) | Catat penerimaan pekerjaan, tagihan, pembayaran, biaya |\n| Strategi | [Roadmap](../03-Roadmap/90-DAYS.md) | Pilih hasil minggu ini |\n| Keputusan | [Log](../00-Governance/DECISION-LOG.md) | Catat perubahan yang disetujui |\n| Perbaikan | [Review mingguan](WEEKLY-REVIEW.md) | Nilai hasil, waktu, dan hambatan |\n\n## Proyek aktif\n\n| ID | Klien | Lingkup/tautan brief | Tahap | Milestone berikutnya | Tenggat | Hambatan |\n|---|---|---|---|---|---|---|\n\n## Antrean konten\n\n| ID | Masalah/ide | Pilar | Bukti/demo | Status | Tanggal rencana | Percakapan relevan yang dihasilkan |\n|---|---|---|---|---|---|---|\n\n## Hambatan yang diketahui\n\n1. Isi jawaban strategi lama belum terbaca.\n2. File dashboard Business OS lama belum tersedia.\n3. Kapasitas, tanggal mulai, harga, serta kondisi penjualan aktual belum diisi.\n\n## Batas fungsi\n\nDashboard ini berupa dokumen kerja, bukan aplikasi dengan kalkulasi otomatis, pengingat, login, atau sinkronisasi. Sumber prospek berada di CRM dan sumber angka berada di ledger. Aset dashboard lama belum diganti; statusnya tercatat dalam inventaris.\n"
  },
  {
    "title": "Ledger operasional",
    "path": "06-Business-OS/FINANCE.md",
    "content": "# Ledger operasional\n\nVersi 0.1.0 · Template manual baru · Definisi operasional: USULAN\n\nMata uang: IDR. Format tanggal: YYYY-MM-DD. Gunakan ID unik agar tidak menghitung dua kali. Belum ada transaksi aktual.\n\n## Pekerjaan/milestone diterima\n\nSumber omzet operasional berdasarkan tanggal diterima; bukan berdasarkan tanggal proposal atau pembayaran.\n\n| ID penerimaan | ID proyek | Milestone | Tanggal diterima | Nilai Rp | Bukti penerimaan |\n|---|---|---|---|---:|---|\n\n## Tagihan\n\n| ID invoice | ID proyek | Tanggal terbit | Jatuh tempo | Nilai Rp | Status/keterangan |\n|---|---|---|---|---:|---|\n\n## Pembayaran diterima\n\n| ID pembayaran | ID invoice | ID proyek | Tanggal terima | Nilai Rp | Bukti |\n|---|---|---|---|---:|---|\n\nJika pembayaran melunasi beberapa invoice, buat baris alokasi dengan ID berbeda dan total yang sama dengan bukti transfer. Jangan menyalin seluruh nilai transfer ke setiap invoice.\n\n## Biaya\n\n| ID biaya | ID proyek/umum | Tanggal | Keperluan | Kategori langsung/umum | Nilai Rp | Bukti |\n|---|---|---|---|---|---:|---|\n\n## Rekap bulanan manual\n\n| Bulan YYYY-MM | Omzet diterima Rp | Kas masuk Rp | Biaya langsung Rp | Biaya umum Rp | Catatan |\n|---|---:|---:|---:|---:|---|\n\nOmzet bulan = jumlah nilai pekerjaan diterima dalam bulan tersebut. Kas bulan = jumlah pembayaran berdasarkan tanggal terima. Piutang per invoice = nilai invoice − seluruh pembayaran yang dialokasikan ke invoice itu sampai tanggal laporan. Periksa nilai negatif karena bisa berarti pembayaran lebih atau salah alokasi.\n\nCatatan ini untuk pengendalian operasional internal. Perlakuan pajak dan pelaporan akuntansi belum ditetapkan dalam HQ.\n"
  },
  {
    "title": "Review mingguan",
    "path": "06-Business-OS/WEEKLY-REVIEW.md",
    "content": "# Review mingguan\n\nVersi template 0.1.0 · Salin per minggu ke `06-Business-OS/Reviews/YYYY-MM-DD.md`.\n\n- Periode:\n- Kapasitas tersedia / jam aktual:\n- Tiga hasil terpenting:\n\n| Metrik | Minggu ini | Bukti/sumber | Pelajaran |\n|---|---|---|---|\n| Percakapan relevan | | | |\n| Discovery selesai | | | |\n| Proposal terkirim | | | |\n| Won / Lost | | | |\n| Omzet operasional | | | |\n| Kas masuk | | | |\n| Biaya langsung | | | |\n| Jam penjualan / delivery / admin | | | |\n\n## Evaluasi\n\n- Apa yang memberi hasil?\n- Apa yang menghabiskan waktu tanpa hasil?\n- Apakah ada revisi di luar lingkup atau pembayaran terlambat?\n- Hipotesis apa yang didukung/ditolak oleh bukti minggu ini?\n- Apa yang dihentikan, diteruskan, dan dicoba?\n- Keputusan baru dan ID decision log:\n- Tiga hasil minggu depan:\n- Backup terakhir dan lokasi:\n\nJangan mengubah status USULAN menjadi FINAL hanya karena template ini telah diisi. Catat persetujuan Sams dan sumbernya.\n"
  },
  {
    "title": "Inventaris tools dan aset",
    "path": "07-Tools/INVENTORY.md",
    "content": "# Inventaris tools dan aset\n\nVersi 0.1.0 · 20 Oktober 2026\n\n“Tersedia” berarti ada berkas dalam paket ini. “Dibuat baru” tidak berarti ditemukan dari percakapan lama. Tidak ada akun/langganan eksternal yang diaudit.\n\n| ID | Tool/aset | Asal | Status | Lokasi / langkah berikutnya |\n|---|---|---|---|---|\n| T-001 | Konsep branding | Pesan pengguna lama + sekarang | Sebagian terverifikasi | Brand dan register sumber |\n| T-002 | Dashboard Business OS lama | Disebut dalam permintaan | BELUM TERVERIFIKASI | Perlu berkas asli/tautan yang bisa dibuka |\n| T-003 | Tools lain dari percakapan lama | Disebut secara umum | BELUM TERVERIFIKASI | Nama, jumlah, dan fungsi belum diketahui |\n| T-004 | Lampiran image(1).png | Terdaftar pada hasil pembacaan | BELUM DIPERIKSA, belum diimpor | Jangan dipakai sebagai brand final |\n| T-005 | Master + versioning + decision log | Dibuat baru | TERSEDIA, dokumen | `00-Governance` |\n| T-006 | CRM | Dibuat baru | TERSEDIA, template manual kosong | `04-Sales/CRM.md` |\n| T-007 | Sales playbook | Dibuat baru | TERSEDIA, usulan | `04-Sales/PLAYBOOK.md` |\n| T-008 | SOP + brief/proposal | Dibuat baru | TERSEDIA, usulan | `05-Delivery` |\n| T-009 | Business OS manual | Dibuat baru | TERSEDIA, belum berisi data aktual | `06-Business-OS/DASHBOARD.md` |\n| T-010 | Ledger dan review | Dibuat baru | TERSEDIA, template manual kosong | `06-Business-OS` |\n| T-011 | Langganan AI, hosting, domain, layanan kerja | Tidak tersedia dari sumber | BELUM TERVERIFIKASI | Isi register akun tanpa menyimpan rahasia |\n\n## Rencana tools berikutnya — USULAN, belum dibangun\n\n| Prioritas | Kandidat | Mulai bila | Kriteria selesai |\n|---|---|---|---|\n| P0 | Pemulihan dashboard/aset lama | Berkas asli tersedia | Fungsi, data, dependensi, dan ekspor terpetakan; aset disalin ke HQ |\n| P1 | CRM dengan filter dan pengingat | Tindak lanjut sering terlewat pada proses manual | Filter jatuh tempo benar; tidak mengirim pesan tanpa tindakan Sams; ekspor tersedia |\n| P1 | Kalkulator harga dan kapasitas | Ada catatan estimasi vs waktu aktual | Input jam/biaya/cadangan menghasilkan estimasi transparan dan bisa diubah |\n| P2 | Generator proposal | Struktur penawaran sudah dipakai berulang | Menghasilkan proposal dari brief dengan versi, batas lingkup, dan kolom wajib |\n| P2 | Dashboard terhubung ledger | Definisi angka sudah dipilih dan pencatatan konsisten | Angka cocok dengan sumber; tidak menggandakan DP dan omzet |\n| P3 | Perencana konten dan pustaka studi kasus | Ada format konten yang terbukti membawa percakapan relevan | Ide, bukti, izin klien, jadwal, dan hasil dapat ditelusuri |\n\nUrutan ini bisa berubah setelah sumber lama dipulihkan. Jangan membangun tool duplikat sebelum memeriksa yang sudah ada.\n\n## Register akun untuk diisi\n\n| Layanan | Fungsi | Pemilik akun | Paket/biaya | Perpanjangan | Lokasi pengelolaan akses | Status |\n|---|---|---|---|---|---|---|\n\nCatat lokasi pengelolaan kredensial, bukan kata sandi atau API key.\n\n## Kartu pemeriksaan aset lama\n\n- Nama / versi / sumber asli:\n- Lokasi file dan tanggal diterima:\n- Bisa dibuka:\n- Fungsi yang benar-benar tersedia:\n- Data contoh atau data nyata:\n- Cara penyimpanan / ekspor / pemulihan:\n- Dependensi dan biaya:\n- Pemilik akun:\n- Masalah yang ditemukan:\n- Keputusan: pakai / perbaiki / arsipkan, beserta sumber persetujuan:\n"
  },
  {
    "title": "Pustaka aset",
    "path": "08-Assets/README.md",
    "content": "# Pustaka aset\n\n- `Incoming/`: ekspor percakapan dan berkas lama yang belum diperiksa.\n- `Brand/`: logo, avatar, warna/font yang telah dikonfirmasi.\n- `Portfolio/`: demo, studi kasus, dan bukti izin publikasi.\n- `Business-OS-Legacy/`: salinan dashboard lama setelah diterima dan diperiksa.\n\nFolder-folder ini disiapkan tanpa aset contoh. Tidak ada file dashboard lama yang berhasil dipulihkan pada versi 0.1.0.\n\nPertahankan file asal. Catat nama, asal, versi, status, dan lokasi di inventaris. Untuk aset klien, simpan bukti izin penggunaan dan hindari menyalin data pribadi yang tidak dibutuhkan.\n"

  {
    "title": "Arsip",
    "path": "09-Archive/README.md",
    "content": "# Arsip\n\n`Releases/` disiapkan untuk snapshot rilis berikutnya. Belum ada riwayat sebelum versi 0.1.0.\n\nSebelum mengubah arah atau keputusan, simpan salinan dokumen yang terdampak ke `Releases/YYYY-MM-DD-vX.Y.Z/`, lalu perbarui changelog. Untuk snapshot seluruh HQ, buat ZIP di luar folder HQ agar arsip tidak memasukkan dirinya sendiri.\n\nArsip mingguan proyek selesai dapat memakai `Projects/P-XXX/`. Jangan hapus bukti persetujuan, penerimaan hasil, atau pembayaran hanya karena proyek ditutup.\n"

  {
    "title": "Somesea HQ",
    "path": "README.md",
    "content": "# Somesea HQ\n\nPusat kerja Sams · @somesea__  \nVersi paket **0.1.0** · 20 Oktober 2026 · Pemilik: Sams\n\n**Mulai dari [dokumen master](00-Governance/MASTER.md), lalu buka [Business OS](06-Business-OS/DASHBOARD.md).**\n\nHQ ini adalah folder kerja lokal yang dapat dipindahkan, dicadangkan, dan dikembangkan. Belum ada sinkronisasi cloud atau otomatisasi. Dokumen Markdown bisa dibuka dengan editor teks dan aplikasi catatan yang mendukung Markdown.\n\n## Isi\n\n| Folder | Fungsi |\n|---|---|\n| [00-Governance](00-Governance/MASTER.md) | Master, sumber, keputusan, versi, dan pertanyaan terbuka |\n| [01-Brand](01-Brand/BRAND.md) | Identitas dan cara berbicara |\n| [02-Strategy](02-Strategy/STRATEGY.md) | Jasa, target omzet, dan eksperimen penawaran |\n| [03-Roadmap](03-Roadmap/90-DAYS.md) | Rencana 90 hari dan evaluasi |\n| [04-Sales](04-Sales/PLAYBOOK.md) | CRM dan alur penjualan |\n| [05-Delivery](05-Delivery/SOP.md) | SOP dan template brief proyek |\n| [06-Business-OS](06-Business-OS/DASHBOARD.md) | Dashboard kerja manual, keuangan, dan ulasan mingguan |\n| [07-Tools](07-Tools/INVENTORY.md) | Inventaris dan antrean pengembangan tools |\n| [08-Assets](08-Assets/README.md) | Tempat aset brand, portofolio, dan pemulihan aset lama |\n| [09-Archive](09-Archive/README.md) | Riwayat versi dan arsip kerja |\n\n## Cara memakai hari ini\n\n1. Baca tabel keputusan final pada master. Rancangan tambahan bukan otomatis keputusan Sams.\n2. Isi tanggal mulai roadmap, kapasitas kerja mingguan, dan kondisi omzet saat ini.\n3. Tambahkan prospek pertama ke CRM; setiap prospek aktif wajib punya tindakan berikutnya.\n4. Buka dashboard setiap awal hari. Pilih maksimal tiga pekerjaan penting.\n5. Setiap akhir minggu, isi ulasan dan cadangkan seluruh folder.\n\n## Batas pemulihan sumber\n\nPercakapan sumber berhasil dibaca sebagian. Pesan pengguna terbaca, tetapi jawaban asisten berupa penanda referensi, tanpa isi strategi atau berkas dashboard. Paket ini **bukan salinan lengkap percakapan lama**. Rancangan operasional baru diberi label USULAN; aset lama diberi label BELUM TERVERIFIKASI. Rincian ada di [catatan sumber](00-Governance/SOURCES.md).\n\nUntuk melengkapi rekonsiliasi, simpan ekspor/teks lengkap percakapan dan berkas Business OS asli di `08-Assets/Incoming`, lalu ikuti checklist sumber. Jangan mengganti usulan menjadi keputusan final tanpa bukti persetujuan yang sesuai.\n"

const revenue=sum('Omzet'),due=state.leads.filter(l=>l.date&&l.date<=today()&&!['Won','Lost'].includes(l.stage)),focus=['Tetapkan kapasitas dan tanggal mulai','Pilih satu penawaran untuk diuji','Catat prospek pertama dan tindak lanjut'];
return intro('Selamat datang, Sams.','Satu ruang untuk ide, relasi, dan bisnis yang terus tumbuh.',button('+ Tambah prospek','lead'))+
`<div class="hero-grid"><section class="target"><div class="target-head"><h2>Arah bulan ini</h2><input aria-label="Bulan laporan" class="month" type="month" id="month" value="${month}"></div><div class="target-value">${money(revenue)} <span>/ Rp5.000.000</span></div><p class="tiny">${state.entries.some(e=>e.type==='Omzet'&&e.date.startsWith(month))?'Omzet dari pekerjaan yang telah diterima.':'Belum ada omzet yang dicatat untuk bulan ini.'}</p><div class="track"><i style="width:${Math.min(100,revenue/5000000*100)}%"></i></div><div class="spread tiny"><span>${Math.round(revenue/5000000*100)}% dari target</span><span>${money(Math.max(0,5000000-revenue))} lagi</span></div></section><section class="panel"><div class="panel-head"><h2>Mulai dari yang penting</h2><span class="muted tiny">${state.tasks.length}/3</span></div>${focus.map((f,i)=>`<label class="focus"><input type="checkbox" data-task="${i}" ${state.tasks.includes(i)?'checked':''}><span>${f}</span></label>`).join('')}</section></div>
<div class="stats"><div class="stat"><span class="muted tiny">Prospek aktif</span><strong>${state.leads.filter(l=>!['Won','Lost'].includes(l.stage)).length}</strong><small>Relasi yang sedang dibangun</small></div><div class="stat"><span class="muted tiny">Follow-up jatuh tempo</span><strong>${due.length}</strong><small>Langkah kecil berikutnya</small></div><div class="stat"><span class="muted tiny">Roadmap selesai</span><strong>${state.road.length}<span class="muted"> / 8</span></strong><small>Fase menuju 90 hari</small></div></div>
<div class="lower"><section class="panel"><div class="panel-head"><h2>Pipeline penjualan</h2><a href="#crm">Buka CRM ↗</a></div>${state.leads.length?leadTable(state.leads.slice(0,4)):empty('Relasi pertama dimulai dari percakapan.','Tambahkan calon klien, pahami masalahnya, lalu tentukan langkah berikutnya.',button('Tambah prospek pertama','lead','subtle'))}</section><section class="panel"><div class="panel-head"><h2>Pelan, tapi terarah.</h2>${badge('USULAN')}</div><p>Bangun fondasi, uji penawaran, lalu ulangi proses yang memberi hasil.</p><div class="steps"><div class="step"><strong>01 / Fondasi</strong><small>Hari 1–30</small></div><div class="step"><strong>02 / Bukti</strong><small>Hari 31–60</small></div><div class="step"><strong>03 / Ritme</strong><small>Hari 61–90</small></div></div><a href="#road">Lihat roadmap lengkap ↗</a></section></div><div class="note">Fondasi brand sudah terkonfirmasi. Harga, segmen, dan proses operasional masih usulan. Aset Business OS lama belum berhasil dipulihkan.</div>`}
function leadTable(leads){return `<div class="table-wrap"><table><thead><tr><th>Prospek / kebutuhan</th><th>Tahap</th><th>Langkah berikutnya</th><th></th></tr></thead><tbody>${leads.map(l=>`<tr><td><strong>${esc(l.name)}</strong><small>${esc(l.problem)}</small></td><td>${badge(l.stage)}</td><td>${esc(l.next||'Belum ditentukan')}<small>${esc(l.date)}</small></td><td><button class="subtle" data-edit="${esc(l.id)}">Edit</button></td></tr>`).join('')}</tbody></table></div>`}
function crm(){const list=state.leads.filter(l=>(!filter||l.stage===filter)&&(l.name+' '+l.problem).toLowerCase().includes(search.toLowerCase()));return intro('Relasi sebelum transaksi.','Catat kebutuhan, jaga percakapan, dan buat tindak lanjut yang jelas.',button('+ Tambah prospek','lead'))+`<div class="toolbar"><input type="search" id="search" placeholder="Cari nama atau kebutuhan…" aria-label="Cari prospek" value="${esc(search)}"><select id="filter" aria-label="Filter tahap"><option value="">Semua tahap</option>${stages.map(s=>`<option ${filter===s?'selected':''}>${s}</option>`).join('')}</select><span class="muted tiny">${list.length} prospek</span></div><section class="panel">${list.length?leadTable(list):empty(state.leads.length?'Tidak ada hasil yang cocok.':'CRM siap untuk prospek pertamamu.','Data asli kamu akan muncul di sini. Tidak ada prospek contoh.')}</section><div class="note">Won berarti penawaran disetujui, bukan pembayaran diterima. Catat pembayaran terpisah di Keuangan. Panduan discovery dan proposal tersedia di Pustaka HQ.</div>`}
function roadmap(){return intro('90 hari, satu arah.','Rencana kerja yang bisa kamu sesuaikan dengan kapasitas nyata.',badge('USULAN'))+`<div class="toolbar"><label>Tanggal mulai<input id="start" type="date" value="${esc(state.start)}"></label><span class="muted">${state.road.length} dari 8 fase ditandai selesai</span></div><div class="cards">${road.map((r,i)=>`<section class="panel road-card"><div class="day">HARI<br>${r[0]}</div><div><h3>${r[1]}</h3><p>${r[2]}</p><label><span><input type="checkbox" data-road="${i}" ${state.road.includes(i)?'checked':''}> Fase selesai</span></label></div></section>`).join('')}</div><div class="note">Roadmap ini rancangan baru. Tanggal mulai belum dianggap keputusan sampai kamu mengisinya. Detail evaluasi hari 30, 60, dan 90 ada di Pustaka HQ.</div>`}
function finance(){return intro('Angka yang memberi arah.','Pisahkan omzet, uang yang diterima, dan biaya.',button('+ Catat transaksi','entry'))+`<div class="toolbar"><label>Bulan laporan<input id="month" type="month" value="${month}"></label></div><div class="stats">${['Omzet','Kas masuk','Biaya'].map(t=>`<div class="stat"><span class="muted">${t}</span><strong style="font-size:23px">${money(sum(t))}</strong><small>Berdasarkan catatan bulan terpilih</small></div>`).join('')}</div><section class="panel">${state.entries.filter(e=>e.date.startsWith(month)).length?`<div class="table-wrap"><table><thead><tr><th>Tanggal</th><th>Uraian</th><th>Jenis</th><th>Nilai</th><th></th></tr></thead><tbody>${state.entries.filter(e=>e.date.startsWith(month)).map(e=>`<tr><td>${esc(e.date)}</td><td>${esc(e.title)}</td><td>${esc(e.type)}</td><td>${money(e.value)}</td><td><button class="subtle" data-entry="${esc(e.id)}">Edit</button></td></tr>`).join('')}</tbody></table></div>`:empty('Belum ada catatan bulan ini.','Catat omzet saat pekerjaan diterima. Catat kas saat uang benar-benar masuk.')}</section><div class="note">Contoh: DP masuk adalah kas, bukan tambahan omzet. Nilai pekerjaan hanya dicatat sekali sebagai omzet saat diterima. Modul ini belum menghitung piutang atau pajak otomatis; ledger lengkap ada di pustaka.</div>`}
function markdown(text){
const inline=s=>esc(s).replace(/\[([^\]]+)\]\([^)]+\)/g,'$1').replace(/\*\*([^*]+)\*\*/g,'<strong>$1</strong>').replace(/`([^`]+)`/g,'<code>$1</code>');
const lines=text.split('\n');let out='',table=false;
for(let i=1;i<lines.length;i++){const line=lines[i].trim();
if(line.startsWith('|')){if(/^\|[\s:|-]+\|$/.test(line))continue;const cells=line.split('|').slice(1,-1);if(!table){out+='<div class="table-wrap"><table>';table=true}out+='<tr>'+cells.map(c=>`<td>${inline(c.trim())}</td>`).join('')+'</tr>';continue}
if(table){out+='</table></div>';table=false}
if(!line)continue;
const heading=line.match(/^(#{2,4})\s+(.*)/);if(heading){const tag='h'+Math.min(4,heading[1].length);out+=`<${tag}>${inline(heading[2])}</${tag}>`;continue}
if(line.startsWith('>')){out+=`<blockquote>${inline(line.slice(1).trim())}</blockquote>`;continue}
if(/^[-*] /.test(line)){out+=`<p class="doc-bullet">• ${inline(line.slice(2))}</p>`;continue}
out+=`<p>${inline(line)}</p>`;
}return out+(table?'</table></div>':'')
}
function docs(){const d=window.HQ_DOCS[docIndex];return intro('Semua konteks, tetap dekat.','18 dokumen sumber. Keputusan, strategi, dan cara kerja dalam satu pustaka.')+`<div class="doc-layout"><div class="doc-list">${window.HQ_DOCS.map((d,i)=>`<button data-doc="${i}" class="${i===docIndex?'active':''}">${esc(d.title)}</button>`).join('')}</div><article class="panel article"><div class="spread"><h2>${esc(d.title)}</h2>${button('↓ Unduh dokumen','download-doc','subtle')}</div><small>${esc(d.path)} · v0.1.0</small><div class="doc-body">${markdown(d.content)}</div></article></div>`}
function decisions(){return intro('Jelas mana yang disepakati.','Keputusan final punya sumber. Ide baru tetap bisa diuji.',button('+ Catat keputusan','decision'))+`<section class="panel">${finals.map((d,i)=>`<div class="decision"><div class="spread"><span class="muted tiny">D-00${i+1}</span>${badge('FINAL')}<strong>${d[0]}</strong></div><p>${d[1]}</p></div>`).join('')}${state.decisions.map(d=>`<div class="decision"><div class="spread">${badge(d.status)}<strong>${esc(d.title)}</strong></div><p>${esc(d.source)}</p><small>Dicatat oleh Sams pada workspace ini.</small></div>`).join('')}</section><div class="note">Persetujuan umum pada percakapan lama tidak dipakai untuk mengesahkan rincian yang belum terbaca. Keputusan baru ditambahkan ke log, bukan menimpa riwayat.</div>`}
function tools(){const rows=[['Master & decision log','TERSEDIA','Dokumen sumber dan versi awal sudah tersedia.'],['CRM interaktif','TERSEDIA','Tambah, edit, cari, dan filter prospek. Data disimpan di browser.'],['Dashboard & ledger','TERSEDIA','Ringkasan omzet dan catatan transaksi dari input kamu.'],['Roadmap interaktif','TERSEDIA','Tanggal mulai dan penanda fase selesai.'],['Business OS lama','BELUM TERVERIFIKASI','Berkas asli masih diperlukan untuk rekonsiliasi.'],['Kalkulator harga & kapasitas','USULAN','Dibangun setelah tersedia catatan waktu dan biaya aktual.'],['Generator proposal','USULAN','Menunggu struktur penawaran yang sudah dipakai berulang.'],['Sinkronisasi lintas perangkat','USULAN','Versi sekarang belum memiliki database cloud. Gunakan ekspor dan impor.']];return intro('Tools mengikuti kebutuhan.','Pakai yang membantu sekarang. Bangun berikutnya dari hambatan nyata.')+`<section class="panel">${rows.map(r=>`<div class="toolrow"><div><h3>${r[0]}</h3><p>${r[2]}</p></div>${badge(r[1])}</div>`).join('')}</section><div class="note">Web ini versi baru dari fondasi HQ, bukan pemulihan aplikasi lama. Semua 18 dokumen tetap disertakan. Ekspor data berisi perubahan interaktif; dokumen sumber dapat diunduh dari pustaka.</div>`}
function render(){page=location.hash.slice(1)||'home';if(!nav.some(n=>n[0]===page))page='home';$('#nav').innerHTML=nav.map(n=>`<a href="#${n[0]}" class="${page===n[0]?'active':''}" ${page===n[0]?'aria-current="page"':''}><span class="nav-icon">${n[1]}</span>${n[2]}</a>`).join('');$('#breadcrumb').textContent='Ruang kerja / '+nav.find(n=>n[0]===page)[2];$('#app').innerHTML=({home,crm,road:roadmap,finance,docs,decisions,tools}[page])();if(storageError)$('#app').insertAdjacentHTML('afterbegin','<div role="alert" class="note">Data browser tidak dapat dibaca atau disimpan. Ekspor sebelum menutup. Data lama tidak dihapus.</div>')}
function field(name,label,value='',type='text',required=true){return `<label>${label}<input name="${name}" type="${type}" value="${esc(value)}" ${required?'required':''} ${type==='number'?'min="0" step="1"':''} maxlength="500"></label>`}
function select(name,label,options,value){return `<label>${label}<select name="${name}">${options.map(o=>`<option ${o===value?'selected':''}>${o}</option>`).join('')}</select></label>`}
function modal(title,fields,callback){$('#modal-title').textContent=title;$('#fields').innerHTML=fields;$('#form').onsubmit=e=>{e.preventDefault();if(!$('#form').reportValidity())return;const data=Object.fromEntries(new FormData($('#form')));if(callback(data)===false)return;$('#modal').close();save()};$('#modal').showModal()}
function lead(id){const l=state.leads.find(l=>l.id===id)||{};modal(l.id?'Edit prospek':'Prospek baru',field('name','Nama / usaha',l.name)+field('problem','Kebutuhan atau masalah',l.problem)+select('stage','Tahap',stages,l.stage)+field('value','Nilai estimasi (Rp), isi 0 jika belum diketahui',l.value??0,'number')+field('next','Tindakan berikutnya',l.next)+field('date','Tanggal tindak lanjut',l.date,'date'),d=>{d.id=l.id||crypto.randomUUID();d.value=Number(d.value);if(l.id)state.leads[state.leads.findIndex(x=>x.id===l.id)]=d;else state.leads.push(d)})}
function entry(id){const old=state.entries.find(e=>e.id===id)||{};modal(old.id?'Edit catatan':'Catat transaksi',field('title','Uraian / proyek',old.title)+select('type','Jenis catatan',['Omzet','Kas masuk','Biaya'],old.type)+field('value','Nilai (Rp)',old.value,'number')+field('date','Tanggal',old.date||today(),'date'),d=>{d.value=Number(d.value);if(d.value<=0){toast('Nilai harus lebih dari nol.');return false}d.id=old.id||crypto.randomUUID();if(old.id)state.entries[state.entries.findIndex(e=>e.id===old.id)]=d;else state.entries.push(d)})}
function decision(){modal('Catat keputusan',field('title','Keputusan / ide')+select('status','Status',['USULAN','EKSPERIMEN','FINAL'],'USULAN')+field('source','Sumber persetujuan atau alasan'),d=>state.decisions.push({...d,id:crypto.randomUUID()}))}
function download(name,content,type){const a=document.createElement('a'),url=URL.createObjectURL(new Blob([content],{type}));a.href=url;a.download=name;a.click();setTimeout(()=>URL.revokeObjectURL(url),1000)}
$('#app').addEventListener('click',e=>{const b=e.target.closest('button');if(!b)return;if(b.dataset.edit)lead(b.dataset.edit);if(b.dataset.entry)entry(b.dataset.entry);if(b.dataset.doc!==undefined){docIndex=Number(b.dataset.doc);render()}if(b.dataset.action==='lead')lead();if(b.dataset.action==='entry')entry();if(b.dataset.action==='decision')decision();if(b.dataset.action==='download-doc'){const d=window.HQ_DOCS[docIndex];download(d.path.split('/').pop(),d.content,'text/markdown')}});
$('#app').addEventListener('change',e=>{if(e.target.id==='filter'){filter=e.target.value;render()}if(e.target.id==='month'){month=e.target.value||today().slice(0,7);render()}if(e.target.id==='start'){state.start=e.target.value;save()}for(const k of ['task','road'])if(e.target.dataset[k]!==undefined){const index=Number(e.target.dataset[k]),array=k==='task'?'tasks':'road';state[array]=e.target.checked?[...new Set([...state[array],index])]:state[array].filter(i=>i!==index);save()}});
$('#app').addEventListener('input',e=>{if(e.target.id==='search'){const pos=e.target.selectionStart;search=e.target.value;render();$('#search').focus();$('#search').setSelectionRange(pos,pos)}});
$('#close').onclick=$('#cancel').onclick=()=>$('#modal').close();
$('#export').onclick=()=>download(`somesea-data-${today()}.json`,JSON.stringify(state,null,2),'application/json');
$('#import').onclick=()=>$('#import-file').click();
$('#import-file').onchange=async e=>{const file=e.target.files[0];if(!file)return;try{if(file.size>2000000)throw Error();const incoming=JSON.parse(await file.text());if(!valid(incoming))throw Error();modal('Impor cadangan',`<p>Cadangan berisi ${incoming.leads.length} prospek, ${incoming.entries.length} transaksi, dan ${incoming.decisions.length} keputusan baru. Data saat ini akan diganti.</p><p>Ekspor data saat ini terlebih dahulu jika ingin menyimpannya.</p>`,()=>{state=incoming})}catch{toast('File tidak valid. Gunakan cadangan JSON dari Somesea HQ (maks. 2 MB).')}e.target.value=''};
window.addEventListener('hashchange',()=>{render();window.scrollTo(0,0)});render();
</script></body></html>
